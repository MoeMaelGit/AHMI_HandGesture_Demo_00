<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" role="img" aria-label="Cocoon Pod autonomous taxi">
  <defs>
    <!-- Pearl-silver body — cool top, slightly warmer bottom -->
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"  stop-color="#fdfefe"/>
      <stop offset="52%" stop-color="#eceff3"/>
      <stop offset="100%" stop-color="#c6ccd4"/>
    </linearGradient>

    <!-- Dark warm-tinted greenhouse glass — amber interior visible -->
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"  stop-color="#0a0908" stop-opacity="0.96"/>
      <stop offset="45%" stop-color="#231a12" stop-opacity="0.92"/>
      <stop offset="80%" stop-color="#3a2a1a" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#1e1612" stop-opacity="0.92"/>
    </linearGradient>

    <!-- Warm interior glow visible through the tint -->
    <radialGradient id="interiorAmber" cx="50%" cy="60%" r="60%">
      <stop offset="0%"  stop-color="rgba(255, 205, 140, 0.62)"/>
      <stop offset="50%" stop-color="rgba(255, 168, 84, 0.22)"/>
      <stop offset="100%" stop-color="rgba(255, 165, 80, 0)"/>
    </radialGradient>

    <!-- Top-edge glass reflection -->
    <linearGradient id="glassShine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.50)"/>
      <stop offset="40%" stop-color="rgba(255,255,255,0.09)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>

    <!-- Soft-gold LED glow -->
    <filter id="ledGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3.0" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softShadow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
  </defs>

  <!-- ─── Ground shadow ──────────────────────────────────────────────── -->
  <ellipse cx="320" cy="320" rx="266" ry="11" fill="rgba(0,0,0,0.20)" filter="url(#softShadow)"/>
  <ellipse cx="320" cy="316" rx="236" ry="5"  fill="rgba(0,0,0,0.32)"/>

  <!-- ─── BODY — low, elongated pod silhouette ──────────────────────── -->
  <!-- Flatter dome + long body band: the sleek Cocoon Pod stance. -->
  <path d="
    M 48 300
    L 48 172
    C 48 110, 150 78, 320 76
    C 490 78, 592 110, 592 172
    L 592 300
    Q 592 305 587 305
    L 53 305
    Q 48 305 48 300 Z
  " fill="url(#bodyGrad)" stroke="rgba(180, 188, 200, 0.5)" stroke-width="0.6"/>

  <!-- ─── GLASS GREENHOUSE — large wraparound dark tint ─────────────── -->
  <!-- Big greenhouse following the dome; beltline at y=182. -->
  <path id="glassPath" d="
    M 96 182
    C 96 122, 188 100, 320 98
    C 452 100, 544 122, 544 182
    L 96 182 Z
  " fill="url(#glassGrad)"/>

  <!-- Interior amber glow seen through the glass -->
  <path d="
    M 96 182
    C 96 122, 188 100, 320 98
    C 452 100, 544 122, 544 182
    L 96 182 Z
  " fill="url(#interiorAmber)"/>

  <!-- Suggested seat silhouettes inside (faint rear-facing pair) -->
  <g opacity="0.40" fill="rgba(48, 40, 30, 0.85)">
    <rect x="212" y="126" width="46" height="56" rx="10"/>
    <rect x="382" y="126" width="46" height="56" rx="10"/>
  </g>

  <!-- Pillar accents where the doors meet the body (subtle) -->
  <line x1="192" y1="104" x2="192" y2="182" stroke="rgba(225, 230, 238, 0.16)" stroke-width="0.8"/>
  <line x1="448" y1="104" x2="448" y2="182" stroke="rgba(225, 230, 238, 0.16)" stroke-width="0.8"/>
  <!-- Centre door divider in the glass -->
  <line x1="320" y1="98" x2="320" y2="182" stroke="rgba(225, 230, 238, 0.20)" stroke-width="0.9"/>

  <!-- Glass top reflection — slim shine following the curve -->
  <path d="
    M 108 142
    C 132 116, 204 102, 320 102
    C 436 102, 508 116, 532 142
  " fill="none" stroke="url(#glassShine)" stroke-width="1.5" opacity="0.85"/>

  <!-- ─── LED LIGHT BAR — soft-gold strip along the upper glass edge ── -->
  <path d="M 140 94 C 220 78, 420 78, 500 94" fill="none" stroke="rgba(219, 192, 124, 0.80)" stroke-width="1.6" filter="url(#ledGlow)"/>
  <path d="M 140 94 C 220 78, 420 78, 500 94" fill="none" stroke="rgba(238, 220, 170, 0.92)" stroke-width="0.7"/>

  <!-- Beltline underscore below the glass -->
  <line x1="96" y1="184" x2="544" y2="184" stroke="rgba(150, 140, 120, 0.32)" stroke-width="0.8"/>

  <!-- ─── DOOR DETAILS (revealed when the HTML door divs slide out) ──── -->
  <!-- Door indicator button (soft-gold dot on the door surface) -->
  <circle cx="300" cy="222" r="4" fill="#dbc07c" filter="url(#ledGlow)"/>
  <circle cx="300" cy="222" r="2.4" fill="#f1e2b8"/>

  <!-- Subtle door-handle recesses -->
  <rect x="276" y="244" width="22" height="2.5" rx="1.2" fill="rgba(150, 145, 130, 0.42)"/>
  <rect x="342" y="244" width="22" height="2.5" rx="1.2" fill="rgba(150, 145, 130, 0.42)"/>

  <!-- ─── WHEEL ARCHES + WHEELS ─────────────────────────────────────── -->
  <ellipse cx="140" cy="302" rx="56" ry="13" fill="rgba(15, 14, 12, 0.55)"/>
  <ellipse cx="500" cy="302" rx="56" ry="13" fill="rgba(15, 14, 12, 0.55)"/>

  <!-- Front wheel (tucked under the body) -->
  <circle cx="140" cy="302" r="30" fill="#0b0a08"/>
  <circle cx="140" cy="302" r="24" fill="#1c1a16"/>
  <circle cx="140" cy="302" r="14" fill="#272420"/>
  <circle cx="140" cy="302" r="24" fill="none" stroke="rgba(197, 169, 97, 0.45)" stroke-width="0.7"/>
  <circle cx="140" cy="302" r="3.4" fill="rgba(197, 169, 97, 0.55)"/>

  <!-- Rear wheel -->
  <circle cx="500" cy="302" r="30" fill="#0b0a08"/>
  <circle cx="500" cy="302" r="24" fill="#1c1a16"/>
  <circle cx="500" cy="302" r="14" fill="#272420"/>
  <circle cx="500" cy="302" r="24" fill="none" stroke="rgba(197, 169, 97, 0.45)" stroke-width="0.7"/>
  <circle cx="500" cy="302" r="3.4" fill="rgba(197, 169, 97, 0.55)"/>

  <!-- ─── FRONT LIGHT — warm-white vertical strip at the front edge ── -->
  <rect x="49.5" y="226" width="3.4" height="34" rx="1.6" fill="rgba(255, 240, 214, 0.80)" filter="url(#ledGlow)"/>
  <rect x="49.5" y="226" width="3.4" height="34" rx="1.6" fill="rgba(255, 248, 232, 0.95)"/>

  <!-- Rear tail light — warm red strip at the rear edge -->
  <rect x="587.1" y="226" width="3.4" height="34" rx="1.6" fill="rgba(214, 86, 60, 0.85)" filter="url(#ledGlow)"/>
  <rect x="587.1" y="226" width="3.4" height="34" rx="1.6" fill="rgba(232, 120, 90, 0.95)"/>

  <!-- ─── Cocoon BRAND BADGE — small mark above the rear wheel arch ── -->
  <g transform="translate(478, 274)">
    <path d="M -7 -1 Q -11 -6 -7 -10 Q -3 -7 0 -2 Q 3 -7 7 -10 Q 11 -6 7 -1 Q 3 1 0 -2 Q -3 1 -7 -1 Z"
          fill="rgba(150, 130, 92, 0.55)"/>
    <text x="15" y="2" font-family="'Inter','Segoe UI',sans-serif" font-size="8.5" font-weight="700"
          letter-spacing="2.4" fill="rgba(150, 132, 96, 0.72)">COCOON</text>
  </g>

  <!-- ─── Side QR/info chip (a tiny detail) ──────────────────────── -->
  <g transform="translate(150, 276)" opacity="0.5">
    <rect width="10" height="10" rx="1.4" fill="none" stroke="rgba(140, 126, 96, 0.55)" stroke-width="0.7"/>
    <rect x="2" y="2" width="2" height="2" fill="rgba(140, 126, 96, 0.55)"/>
    <rect x="6" y="2" width="2" height="2" fill="rgba(140, 126, 96, 0.55)"/>
    <rect x="2" y="6" width="2" height="2" fill="rgba(140, 126, 96, 0.55)"/>
    <rect x="6" y="6" width="2" height="2" fill="rgba(140, 126, 96, 0.55)"/>
  </g>
</svg>
